<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meduza mobile — My booking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0;background:#05070E;-webkit-font-smoothing:antialiased}
a{color:#7AD7F0}a:hover{color:#B5E9F7}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #7AD7F0;outline-offset:2px}
@keyframes mzpulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #05070E; color: #F5F5F7; font-family: Inter, -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; line-height: 1.47">
  <div style="position: absolute; inset: 0; overflow-y: auto; padding: 54px 20px 130px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 4px 0 0; font-family: 'Inter Tight', Inter, sans-serif; font-size: 34px; font-weight: 600; letter-spacing: -0.03em">My booking</h1>

    <!-- Ticket -->
    <article style="border-radius: 28px; overflow: hidden; background: #0B1020; border: 1px solid {{st.border}}; box-shadow: {{st.glow}}">
      <div style="position: relative; height: 150px">
        <img src="../assets/photos/lounge.jpg" alt="Lounge with velvet sofas" style="width: 100%; height: 100%; object-fit: cover">
        <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,16,32,0) 30%, #0B1020 100%)"></div>
        <span role="status" style="position: absolute; left: 16px; top: 16px; height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 999px; background: rgba(10,15,30,0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: {{st.color}}; font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 999px; background: {{st.color}}; box-shadow: 0 0 10px {{st.color}}; animation: {{st.anim}}"></span>{{st.label}}</span>
      </div>
      <div style="padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Inter Tight', Inter, sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; font-variant-numeric: tabular-nums">Mon 17 Nov · 20:30</span>
          <span style="font-size: 15px; color: #A7ABB8">2 guests</span>
        </div>
        <div aria-hidden="true" style="height: 0; border-top: 1.5px dashed rgba(255,255,255,0.14); margin: 0 -20px"></div>
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #A7ABB8"><span>Reference</span><span style="font-family: ui-monospace, Menlo, monospace; color: #F5F5F7">MDZ-2417</span></div>
        <p style="margin: 0; font-size: 14px; color: #C9CCD6">{{st.note}}</p>
      </div>
    </article>

    <!-- Timeline -->
    <ol aria-label="Booking progress" style="margin: 0; padding: 4px 4px 0; list-style: none; display: flex; flex-direction: column">
      <sc-for list="{{steps}}" as="t" hint-placeholder-count="3">
        <li style="display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: start; min-height: 52px">
          <span style="display: flex; flex-direction: column; align-items: center; height: 100%">
            <span style="width: 20px; height: 20px; border-radius: 999px; background: {{t.dot}}; border: {{t.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #05070E"><sc-if value="{{t.done}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/></svg></sc-if></span>
            <span style="flex: 1; width: 1.5px; background: {{t.line}}; min-height: 24px"></span>
          </span>
          <span style="display: flex; flex-direction: column; padding-bottom: 14px"><span style="font-size: 15px; font-weight: 600; color: {{t.fg}}">{{t.label}}</span><span style="font-size: 13px; color: #7C8294">{{t.sub}}</span></span>
          <span style="font-size: 13px; color: #A7ABB8; font-variant-numeric: tabular-nums">{{t.time}}</span>
        </li>
      </sc-for>
    </ol>

    <!-- Actions -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="m5-visit.dc.html" style="height: 56px; border-radius: 18px; background: #131A2E; color: #F5F5F7; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7AD7F0" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>Directions</a>
      <a href="#" style="height: 56px; border-radius: 18px; background: #131A2E; color: #F5F5F7; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7AD7F0" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V17A2.5 2.5 0 0 1 4 14.5Z"/></svg>Message us</a>
      <button type="button" style="height: 56px; border-radius: 18px; border: 0; background: #131A2E; color: #F5F5F7; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7AD7F0" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Add to calendar</button>
      <a href="m3-booking.dc.html" style="height: 56px; border-radius: 18px; background: #131A2E; color: #F5F5F7; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7AD7F0" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16Z"/></svg>Change</a>
    </div>
    <button type="button" style="height: 48px; border: 0; background: transparent; color: #FF7A6B; font-size: 15px; font-weight: 600">Cancel booking</button>
  </div>

  <!-- Tab bar -->
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, rgba(5,7,14,0) 0%, #05070E 60%); pointer-events: none"></div>
  <nav aria-label="Tabs" style="position: absolute; left: 14px; right: 14px; bottom: 30px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px; border-radius: 30px; background: rgba(19,26,46,0.78); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.12)">
    <a href="m1-home.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #A7ABB8; text-decoration: none; font-size: 10px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 11a7 7 0 0 1 14 0v.5H5Z"/><path d="M8 11.5v2.5c0 1.6-1.2 2.4-1.2 4.2M12 11.5v7.5M16 11.5v2.5c0 1.6 1.2 2.4 1.2 4.2"/></svg>Meduza</a>
    <a href="m2-menu-reader.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #A7ABB8; text-decoration: none; font-size: 10px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 3.5h12v17H6zM9 8h6M9 12h6M9 16h3"/></svg>Menu</a>
    <a href="m4-my-booking.dc.html" aria-current="page" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #7AD7F0; text-decoration: none; font-size: 10px; font-weight: 600; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Book</a>
    <a href="m5-visit.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #A7ABB8; text-decoration: none; font-size: 10px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>Visit</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"status":{"editor":"enum","options":["pending","confirmed"],"default":"pending"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const confirmed = (this.props.status ?? 'pending') === 'confirmed';
    const st = confirmed
      ? { label: 'Confirmed', color: '#7FD49B', anim: 'none', border: 'rgba(127,212,155,0.35)', glow: '0 0 40px rgba(127,212,155,0.12)',
          note: 'See you Monday. Show this screen or say your name at the door. [HOLD POLICY]' }
      : { label: 'Waiting for the hostess', color: '#F0A860', anim: 'mzpulse 4s ease-in-out infinite', border: 'rgba(255,255,255,0.08)', glow: 'none',
          note: 'A hostess will confirm your booking in Telegram or by phone, usually within [CONFIRM TIME].' };
    const done = { dot: '#7AD7F0', ring: '0', line: 'rgba(122,215,240,0.5)', fg: '#F5F5F7', done: true };
    const wait = { dot: 'transparent', ring: '1.5px solid rgba(255,255,255,0.3)', line: 'rgba(255,255,255,0.12)', fg: '#A7ABB8', done: false };
    const steps = [
      Object.assign({ label: 'Request sent', sub: 'via meduza-nt.com', time: '18:02' }, done),
      Object.assign({ label: confirmed ? 'Confirmed by the hostess' : 'Hostess is checking tables', sub: 'In Telegram or by phone', time: confirmed ? '18:09' : '' }, confirmed ? done : wait),
      Object.assign({ label: 'Arrive', sub: 'Mon 17 Nov · 20:30', time: '' }, wait, { line: 'transparent' })
    ];
    return { st, steps };
  }
}
</script>
</body>
</html>
