          i('Abyss Whisper', 'Black rum · tea leaf · hibiscus · amaro · black walnut', 260, { s: 2, img: '../assets/menu-pages/cocktails-06.jpg' }),
          i('Lush by Meduza', 'Gin · green apple · melon', 280, { s: 1, img: '../assets/menu-pages/cocktails-07.jpg' }),
          i('Neptune’s Kiss', 'Vodka · guava · shiso · citrus', 260, { s: 1, img: '../assets/menu-pages/cocktails-08.jpg' }),
          i('The Oasis', 'Tequila · ginger · green chartreuse · mint · jasmine', 260, { s: 1, img: '../assets/menu-pages/cocktails-09.jpg' }),
          i('Eden Above', 'Whisky · tea · dry vermouth · elderflower · honey', 280, { s: 3, img: '../assets/menu-pages/cocktails-10.jpg' }),
          i('Coastal Bloom', 'Gin · cucumber · jasmine · molasses · salt', 280, { s: 1, img: '../assets/menu-pages/cocktails-11.jpg' }) ]),
        sec('classic', 'Classic cocktails', 'Классические коктейли', '', '', 'Old menu · confirm', [
          i('Margarita · Aperol Spritz', 'Each', 200),
          i('Mojito · Negroni · Old Fashioned · Espresso Martini', 'Each', 180) ]),
        sec('tea', 'Tea & coffee', 'Чай и кофе', '', '', 'Old menu · confirm', [
          i('Fruit tea · 900 ml pot', 'Orange · Butterfly · Taiga · Moroccan · Tropical', 140),
          i('Coconut coffee', 'Cafe Dừa', 60) ])
      ],
      hookah: [
        sec('hookah', 'Hookah', 'Кальян', '../assets/photos/lounge.jpg', 'Lounge with velvet sofas and neon sign', 'Old menu · confirm', [
          i('Meduza Classic', '[BLEND DESCRIPTION]', 600),
          i('Meduza Premium', '[BLEND DESCRIPTION]', 800),
          i('Meduza on Fruits', '[BLEND DESCRIPTION]', 1000),
          i('Meduza Signature', '[BLEND DESCRIPTION]', 1500) ])
      ]
    };
    // hookah banner is an interior photo, not a menu page
    DATA.hookah[0].banner = '../assets/photos/lounge.jpg';
    const s = this.state;
    const all = DATA[s.tab];
    const sections = (s.cat === 'all' ? all : all.filter(x => x.id === s.cat)).map(sc => Object.assign({}, sc, {
      hasBanner: !!sc.banner,
      items: sc.items.map(it => {
        const hasThumb = !!it.img;
        const photo = hasThumb ? B(it.img) : sc.banner;
        return Object.assign({}, it, {
          veg: !!it.veg, spicy: !!it.spicy, hasThumb,
          img: hasThumb ? B(it.img) : '',
          str: Array.from({ length: it.s || 0 }, (_, k) => k),
          cols: hasThumb ? '52px minmax(0, 1fr) auto' : 'minmax(0, 1fr) auto',
          subCol: hasThumb ? '2 / -1' : '1 / -1',
          subLang: /[а-яё]/i.test(it.v) ? 'ru' : 'en',
          open: () => this.setState({ sel: Object.assign({}, it, {
            photo, pos: hasThumb ? 'center 45%' : 'center', section: sc.title,
            subLang: /[а-яё]/i.test(it.v) ? 'ru' : 'en' }) })
        });
      })
    }));
    const tabs = [['brunch', 'Brunch'], ['dinner', 'Dinner'], ['drinks', 'Drinks'], ['hookah', 'Hookah']].map(([id, label]) => {
      const on = s.tab === id;
      return { label, on, bg: on ? '#F5F5F7' : 'transparent', fg: on ? '#05070E' : '#A7ABB8', shadow: on ? '0 2px 10px rgba(0,0,0,0.35)' : 'none', pick: () => this.setState({ tab: id, cat: 'all' }) };
    });
    const chips = [{ id: 'all', title: 'All' }].concat(all).map(c => {
      const on = s.cat === c.id;
      return { label: c.title, on, bg: on ? '#7AD7F0' : 'transparent', fg: on ? '#05070E' : '#F5F5F7', border: on ? '1px solid #7AD7F0' : '1px solid rgba(255,255,255,0.16)', pick: () => this.setState({ cat: c.id }) };
    });
    const sel = s.sel ? Object.assign({ veg: false, spicy: false }, s.sel, { veg: !!s.sel.veg, spicy: !!s.sel.spicy, hasStr: (s.sel.s || 0) > 0, strWord: words[s.sel.s || 0] })
      : { n: '', v: '', p: '', photo: '', pos: 'center', section: '', subLang: 'en', veg: false, spicy: false, hasStr: false, strWord: '' };
    const footnote = s.tab === 'dinner' || s.tab === 'brunch'
      ? 'Prices in VND. Photos from the printed menu. Tell your server about allergies.'
      : 'Prices in VND, 10% VAT included.';
    return { tabs, chips, sections, sel, sheetOpen: !!s.sel, close: () => this.setState({ sel: null }), footnote };
  }
}
</script>
</body>
</html>
